<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14161f">
<title>¡DERRAPA! · Mando</title>
<style>
  * { box-sizing: border-box; margin: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  html, body { height: 100%; background: #14161f; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px; }
  .hidden { display: none !important; }
  h1 { font-size: 44px; font-weight: 900; font-style: italic; color: #ffcc00; text-shadow: 3px 3px 0 #e8433c; }
  input { font-size: 22px; padding: 14px; border-radius: 12px; border: 0; width: 80%; max-width: 320px; text-align: center; -webkit-user-select: text; user-select: text; touch-action: auto; }
  button { font-size: 22px; padding: 16px 34px; border-radius: 14px; border: 0; background: #e8433c; color: #fff; font-weight: 900; }
  .hint { opacity: .65; font-size: 14px; text-align: center; max-width: 360px; }

  #s-play { padding: 0; gap: 0; }
  #pad { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 12px; padding: 12px; }
  .big { border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; }
  #drift { background: #2b3060; font-size: 24px; }
  #drift.on { background: #4dabf7; color: #000; }
  #drift.c2 { background: #ff922b; color: #000; }
  #item { background: #222533; font-size: 72px; border: 4px dashed #444a63; }
  #item.ready { background: #ffcc00; border: 4px solid #fff; }
  #item small, #drift small { font-size: 13px; font-weight: 600; opacity: .7; margin-top: 4px; }
  #mid { display: flex; flex-direction: column; justify-content: space-between; gap: 10px; text-align: center; }
  #pos { font-size: 64px; font-weight: 900; line-height: 1; }
  #msg { font-size: 18px; opacity: .85; }
  #wheel { height: 16px; background: #222533; border-radius: 8px; position: relative; }
  #knob { position: absolute; top: -7px; width: 30px; height: 30px; border-radius: 50%; left: calc(50% - 15px); background: #fff; }
  #arrows { display: flex; gap: 10px; }
  .tbtn { flex: 1; height: 70px; background: #222533; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 34px; }
  .tbtn.on { background: #444a63; }
  #flash { position: absolute; inset: 0; pointer-events: none; background: #e8433c; opacity: 0; transition: opacity .4s; }
  #rotate { display: none; }
  @media (orientation: portrait) { #s-play:not(.hidden) ~ #rotate { display: flex; } }
</style>
</head>
<body>
<div id="s-join" class="screen">
  <h1>¡DERRAPA!</h1>
  <input id="name" maxlength="12" placeholder="Tu nombre" autocomplete="off">
  <button id="go">¡A CORRER!</button>
  <p class="hint">Pon el móvil en horizontal y gíralo como un volante.<br>Mantén <b>DERRAPE</b> en las curvas y suéltalo para un mini-turbo.</p>
</div>

<div id="s-play" class="screen hidden">
  <div id="pad">
    <div id="drift" class="big">DERRAPE<small>mantén</small></div>
    <div id="mid">
      <div><div id="pos">–</div><div id="msg">Esperando salida…</div></div>
      <div id="wheel"><div id="knob"></div></div>
      <div id="arrows"><div class="tbtn" id="left">◀</div><div class="tbtn" id="right">▶</div></div>
    </div>
    <div id="item" class="big"><span id="itemIcon"></span><small id="itemTxt">sin objeto</small></div>
  </div>
  <div id="flash"></div>
</div>

<div id="rotate" class="screen" style="background:#14161f;z-index:5"><div style="font-size:70px">📱↻</div><p class="hint">Gira el móvil en horizontal</p></div>

<script>
// Si se abre con doble clic (file://) no hay servidor: explicamos qué hacer
if (location.protocol === 'file:') addEventListener('DOMContentLoaded', () => {
  document.body.innerHTML = '<div style="margin:auto;max-width:560px;padding:30px;font:18px system-ui;color:#fff;line-height:1.5">' +
    '<h1 style="color:#ffcc00">¡DERRAPA! necesita su servidor</h1>' +
    '<p>Este archivo no funciona con doble clic. Arranca el juego con <b>npm start</b> en la carpeta <b>derrapa</b> ' +
    'y abre <b>http://localhost:3000</b> en el navegador (o la URL de Render si ya está publicado).</p></div>';
});
</script>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const $ = id => document.getElementById(id);
const ICON = { nitro: '⚡', triple: '⚡', aceite: '🛢️', misil: '🚀', escudo: '🛡️' };
const NAME = { nitro: 'Nitro', triple: 'Nitro', aceite: 'Aceite', misil: 'Misil', escudo: 'Escudo' };
let steerTilt = null, steerTouch = 0, drift = false, itemReq = false, joined = false;

try { $('name').value = localStorage.getItem('derrapa-name') || ''; } catch (e) {}

$('go').onclick = async () => {
  const name = $('name').value.trim() || 'Piloto';
  try { localStorage.setItem('derrapa-name', name); } catch (e) {}
  // iPhone pide permiso explícito para el giroscopio (solo funciona con HTTPS)
  if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
    try { await DeviceOrientationEvent.requestPermission(); } catch (e) {}
  }
  window.addEventListener('deviceorientation', onTilt);
  try { await document.documentElement.requestFullscreen(); } catch (e) {}
  try { await screen.orientation.lock('landscape'); } catch (e) {}
  socket.emit('join', name);
};

socket.on('joined', ({ color }) => {
  joined = true;
  $('s-join').classList.add('hidden');
  $('s-play').classList.remove('hidden');
  $('knob').style.background = color;
  document.body.style.boxShadow = `inset 0 0 0 6px ${color}`;
});
socket.on('full', () => alert('La carrera está llena (12 pilotos)'));
// Si el servidor se reinicia, volvemos a entrar solos
socket.on('connect', () => { if (joined) socket.emit('join', $('name').value.trim() || 'Piloto'); });

function onTilt(e) {
  if (e.beta == null) return;
  const ang = (screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0;
  // En horizontal el "volante" es beta; en vertical, gamma
  const v = ang === 90 ? e.beta : (ang === -90 || ang === 270) ? -e.beta : e.gamma;
  // SENSIBILIDAD: 28° = giro máximo. Si gira al revés, cambia INVERT a -1.
  const INVERT = 1;
  steerTilt = Math.max(-1, Math.min(1, INVERT * v / 28));
}

function hold(el, on, off) {
  const down = ev => { ev.preventDefault(); on(); el.classList.add('on'); };
  const up = ev => { ev.preventDefault(); off(); el.classList.remove('on'); };
  el.addEventListener('pointerdown', down);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => el.addEventListener(t, up));
}
hold($('left'), () => steerTouch = -1, () => { if (steerTouch === -1) steerTouch = 0; });
hold($('right'), () => steerTouch = 1, () => { if (steerTouch === 1) steerTouch = 0; });
hold($('drift'), () => { drift = true; navigator.vibrate?.(20); }, () => drift = false);
$('item').addEventListener('pointerdown', e => { e.preventDefault(); itemReq = true; navigator.vibrate?.(50); });
document.addEventListener('contextmenu', e => e.preventDefault());

// Mando → servidor, 20 veces por segundo
setInterval(() => {
  if (!joined) return;
  const steer = steerTouch !== 0 ? steerTouch : (steerTilt ?? 0);
  socket.emit('input', { steer, drift, item: itemReq });
  itemReq = false;
  $('knob').style.left = `calc(${50 + steer * 48}% - 15px)`;
}, 50);

let lastHits = 0, lastState = '', rollT = 0;
const ROLL = Object.values(ICON);
socket.on('me', m => {
  $('pos').textContent = m.state === 'lobby' ? '–' : `${m.pos}º`;
  $('msg').textContent =
    m.state === 'lobby' ? 'Esperando salida…' :
    m.state === 'countdown' ? `¡Preparados! ${m.countdown > 3 ? 3 : m.countdown}` :
    m.finished ? `🏁 ¡Meta! ${m.time.toFixed(1)} s` :
    m.state === 'finished' ? 'Carrera terminada' :
    `Vuelta ${m.lap}/${m.laps}${m.shield ? ' · 🛡️' : ''}`;

  // Objeto (con ruleta mientras sale)
  const it = $('item');
  if (m.rolling) { $('itemIcon').textContent = ROLL[rollT++ % ROLL.length]; $('itemTxt').textContent = '…'; it.classList.remove('ready'); }
  else if (m.item) {
    $('itemIcon').textContent = ICON[m.item];
    $('itemTxt').textContent = NAME[m.item] + (m.count > 1 ? ` x${m.count}` : '') + ' · toca';
    if (!it.classList.contains('ready')) navigator.vibrate?.([30, 40, 30]);
    it.classList.add('ready');
  } else { $('itemIcon').textContent = ''; $('itemTxt').textContent = 'coge una caja ?'; it.classList.remove('ready'); }

  // Color del botón de derrape según la carga del mini-turbo
  $('drift').classList.toggle('c2', m.drift >= 1);

  // Te han dado: vibración y destello
  if (m.hits > lastHits) { navigator.vibrate?.([200, 60, 200]); $('flash').style.opacity = .6; setTimeout(() => $('flash').style.opacity = 0, 150); }
  lastHits = m.hits;
  if (m.state === 'racing' && lastState === 'countdown') navigator.vibrate?.(300);
  lastState = m.state;
});
</script>
</body>
</html>
